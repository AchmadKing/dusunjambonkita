<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bima Jump! - Web Dusun</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Mainkan game Bima Jump! selagi menunggu situs diluncurkan. Hindari rintangan kaktus neon dan cetak rekor baru!">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&family=Playpen+Sans:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Style -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page-body">
    <!-- Background Effects -->
    <div class="bg-gradient-glow"></div>
    <div class="bg-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Main Game Container -->
    <main class="container game-container">
        <div class="card game-card animate-fade-in">
            <!-- Back Button -->
            <div class="back-navigation">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Kembali ke Beranda</span>
                </a>
            </div>

            <!-- Game Header (Title & Scores) -->
            <div class="game-header">
                <h1 class="game-title"><i class="fa-solid fa-gamepad game-icon-title"></i> Bima Jump!</h1>
                <div class="score-container">
                    <div class="score-item">
                        <span class="score-label">HI</span>
                        <span id="highScoreVal" class="score-val">00000</span>
                    </div>
                    <div class="score-item">
                        <span class="score-label">SCORE</span>
                        <span id="scoreVal" class="score-val">00000</span>
                    </div>
                </div>
            </div>

            <!-- Game Canvas Wrapper -->
            <div class="canvas-wrapper">
                <canvas id="gameCanvas" width="800" height="300"></canvas>
                
                <!-- Game Over Overlay -->
                <div id="gameOverOverlay" class="game-overlay hidden">
                    <div class="overlay-content">
                        <h2 class="game-over-title">GAME OVER</h2>
                        <p class="final-score-text">Skor Anda: <span id="finalScoreVal">0</span></p>
                        <button id="restartGameBtn" class="restart-btn">
                            <i class="fa-solid fa-rotate-right"></i> Main Lagi
                        </button>
                    </div>
                </div>
                
                <!-- Start Game Overlay -->
                <div id="gameStartOverlay" class="game-overlay">
                    <div class="overlay-content">
                        <img src="assets/Idle.png" alt="Bima Jump Start" class="start-cat-img animate-bounce-slow">
                        <h2 class="start-title">Bima Jump!</h2>
                        <p class="control-help">Tekan <strong>SPASI</strong> / <strong>PANAH ATAS</strong> atau <strong>Sentuh Layar</strong> untuk melompat.</p>
                        <button id="startGameBtn" class="start-btn">Mulai Bermain</button>
                    </div>
                </div>
            </div>

            <!-- Game Footer Tips -->
            <div class="game-footer">
                <span>Tip: Hindari kaktus neon! Gunakan Space/Up Arrow atau Tap untuk melompat. Game semakin cepat!</span>
            </div>
        </div>
    </main>

    <!-- Custom Scripts -->
    <script src="game.js"></script>
</body>
</html>
